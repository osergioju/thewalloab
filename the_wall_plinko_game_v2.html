<div id="game-root" style="width: 100%; min-height: 720px; background: linear-gradient(180deg, #0a1628 0%, #0d1f3d 50%, #0a1628 100%); border-radius: var(--border-radius-lg); padding: 24px; position: relative; overflow: hidden; font-family: var(--font-sans);">
  <h2 class="sr-only">The Wall — jogo de plinko com 7 slots e 4 chances</h2>

  <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
    <div style="color: #c8a8ff; font-size: 14px; font-weight: 500; letter-spacing: 1px;">1 ANO</div>
    <div style="text-align: right; color: #b0c4de; font-size: 13px;">
      <div>Chances: <span id="chances" style="color: #fff; font-weight: 500; font-size: 16px;">4</span></div>
      <div style="margin-top: 4px;">Total: <span id="total" style="color: #87ceeb; font-weight: 500; font-size: 16px;">0</span></div>
    </div>
  </div>

  <div style="text-align: center; letter-spacing: 8px; font-size: 18px; margin-bottom: 8px;">
    <span style="color: #5b8def;">T</span><span style="color: #6b8ff0;">H</span><span style="color: #7b91f1;">E</span>
    <span style="margin: 0 12px;"></span>
    <span style="color: #9b94f3;">W</span><span style="color: #b497f4;">A</span><span style="color: #cb9af5;">L</span><span style="color: #e89df6;">L</span>
  </div>
  <div style="height: 1px; background: linear-gradient(90deg, transparent, #5b8def, transparent); margin: 12px auto 16px; max-width: 60%;"></div>

  <div id="status" style="text-align: center; color: #fff; font-size: 28px; font-weight: 300; letter-spacing: 2px; margin-bottom: 12px; min-height: 40px;">COMEÇAR!</div>

  <div style="text-align: center; margin-bottom: 8px;">
    <button id="dropBtn" style="background: linear-gradient(180deg, #4a7fc7, #2c5a9c); color: #fff; border: 1px solid #6ba0e8; padding: 10px 32px; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; letter-spacing: 1px; box-shadow: 0 0 20px rgba(91,141,239,0.4);">SOLTAR BOLINHA</button>
    <button id="resetBtn" style="background: transparent; color: #b0c4de; border: 1px solid #4a6f9c; padding: 10px 24px; border-radius: 8px; font-size: 14px; cursor: pointer; margin-left: 8px;">RECOMEÇAR</button>
  </div>

  <div style="position: relative; max-width: 720px; margin: 0 auto;">
    <canvas id="board" width="700" height="480" style="width: 100%; height: auto; display: block; background: linear-gradient(180deg, rgba(20,40,80,0.6), rgba(40,70,120,0.4)); border: 1px solid rgba(135,206,235,0.3); border-radius: 12px;"></canvas>
  </div>

  <div id="slots" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; max-width: 720px; margin: 8px auto 0;"></div>

  <div id="history" style="max-width: 720px; margin: 16px auto 0; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; min-height: 28px;"></div>
</div>

<script>
(function(){
  const SLOT_VALUES = [500, 150, 300, 50, 30, 25, 2000];
  const SLOT_COUNT = 7;
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const PADDING_X = 30;
  const PEG_ROWS = 8;
  const PEG_COLS = 18;
  const PEG_RADIUS = 4;
  const BALL_RADIUS = 9;
  const GRAVITY = 0.22;
  const BOUNCE = 0.55;
  const FRICTION = 0.99;
  const HORIZ_KICK = 1.4;
  const MAX_FRAMES = 1200; // safety: max ~20s of falling

  const pegs = [];
  const topY = 50;
  const rowGap = 42;
  const colGap = (W - PADDING_X*2) / (PEG_COLS - 1);
  for (let r = 0; r < PEG_ROWS; r++) {
    const offset = (r % 2 === 0) ? 0 : colGap/2;
    const cols = (r % 2 === 0) ? PEG_COLS : PEG_COLS - 1;
    for (let c = 0; c < cols; c++) {
      const x = PADDING_X + offset + c * colGap;
      const y = topY + r * rowGap;
      if (x > 10 && x < W - 10) pegs.push({x, y});
    }
  }

  const slotWidth = W / SLOT_COUNT;
  const slotTopY = topY + PEG_ROWS * rowGap + 10;
  const dividers = [];
  for (let i = 1; i < SLOT_COUNT; i++) {
    dividers.push({x: i * slotWidth, top: slotTopY, bottom: H});
  }

  // Single state object — easier to reason about
  const state = {
    chances: 4,
    total: 0,
    history: [],
    ball: null,
    phase: 'idle', // 'idle' | 'falling' | 'celebrating' | 'gameover'
    highlightSlot: -1,
    rafId: null,
    resetTimerId: null,
    frameCount: 0
  };

  const dropBtn = document.getElementById('dropBtn');
  const resetBtn = document.getElementById('resetBtn');

  function setButtonEnabled(enabled){
    dropBtn.disabled = !enabled;
    dropBtn.style.opacity = enabled ? '1' : '0.4';
    dropBtn.style.cursor = enabled ? 'pointer' : 'not-allowed';
  }

  function refreshButton(){
    // Single source of truth: button is enabled only when idle and chances remain
    const canDrop = state.phase === 'idle' && state.chances > 0;
    setButtonEnabled(canDrop);
  }

  function renderSlots(){
    const wrap = document.getElementById('slots');
    wrap.innerHTML = '';
    SLOT_VALUES.forEach((v, i) => {
      const isHighlight = i === state.highlightSlot;
      const div = document.createElement('div');
      div.style.cssText = `
        background: ${isHighlight ? 'linear-gradient(180deg, rgba(135,206,235,0.4), rgba(91,141,239,0.3))' : 'linear-gradient(180deg, rgba(40,70,120,0.5), rgba(20,40,80,0.5))'};
        border: 1px solid ${isHighlight ? '#87ceeb' : 'rgba(135,206,235,0.3)'};
        border-radius: 8px;
        padding: 10px 4px;
        text-align: center;
        transition: all 0.3s;
        ${isHighlight ? 'box-shadow: 0 0 20px rgba(135,206,235,0.6);' : ''}
      `;
      div.innerHTML = `
        <div style="font-size: 11px; color: #b0c4de; letter-spacing: 1px; margin-bottom: 4px;">SLOT ${i+1}</div>
        <div style="font-size: 22px; color: ${isHighlight ? '#fff' : '#c8e0ff'}; font-weight: 300; letter-spacing: 1px;">${v.toLocaleString('pt-BR')}</div>
        <div style="font-size: 9px; color: #7090b8; letter-spacing: 1px; margin-top: 2px;">PREVCOINS</div>
      `;
      wrap.appendChild(div);
    });
  }

  function renderHistory(){
    const wrap = document.getElementById('history');
    wrap.innerHTML = '';
    state.history.forEach((v, i) => {
      const tag = document.createElement('div');
      tag.style.cssText = `background: rgba(91,141,239,0.2); border: 1px solid rgba(135,206,235,0.4); color: #c8e0ff; padding: 4px 12px; border-radius: 14px; font-size: 12px;`;
      tag.textContent = `Tentativa ${i+1}: ${v.toLocaleString('pt-BR')}`;
      wrap.appendChild(tag);
    });
  }

  function updateHUD(){
    document.getElementById('chances').textContent = state.chances;
    document.getElementById('total').textContent = state.total.toLocaleString('pt-BR');
  }

  function setStatus(text, color){
    const el = document.getElementById('status');
    el.textContent = text;
    el.style.color = color || '#fff';
  }

  function drawBoard(){
    ctx.clearRect(0, 0, W, H);
    const grad = ctx.createRadialGradient(W/2, H/2, 50, W/2, H/2, W/1.2);
    grad.addColorStop(0, 'rgba(135,206,235,0.08)');
    grad.addColorStop(1, 'rgba(10,22,40,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    pegs.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, PEG_RADIUS + 2, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,200,80,0.25)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(p.x, p.y, PEG_RADIUS, 0, Math.PI*2);
      const g = ctx.createRadialGradient(p.x-1, p.y-1, 0, p.x, p.y, PEG_RADIUS);
      g.addColorStop(0, '#fff5c0');
      g.addColorStop(0.5, '#ffc857');
      g.addColorStop(1, '#c08020');
      ctx.fillStyle = g;
      ctx.fill();
    });

    dividers.forEach(d => {
      ctx.beginPath();
      ctx.moveTo(d.x, d.top);
      ctx.lineTo(d.x, d.bottom);
      ctx.strokeStyle = 'rgba(135,206,235,0.5)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    });

    ctx.beginPath();
    ctx.moveTo(0, slotTopY);
    ctx.lineTo(W, slotTopY);
    ctx.strokeStyle = 'rgba(135,206,235,0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();

    if (state.ball){
      const b = state.ball;
      ctx.beginPath();
      ctx.arc(b.x, b.y, BALL_RADIUS + 3, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(200,224,255,0.3)';
      ctx.fill();
      const bg = ctx.createRadialGradient(b.x-3, b.y-3, 0, b.x, b.y, BALL_RADIUS);
      bg.addColorStop(0, '#ffffff');
      bg.addColorStop(0.4, '#d8e8f8');
      bg.addColorStop(1, '#5070a0');
      ctx.beginPath();
      ctx.arc(b.x, b.y, BALL_RADIUS, 0, Math.PI*2);
      ctx.fillStyle = bg;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 0.5;
      ctx.stroke();
    } else {
      const bx = W/2, by = 24;
      ctx.beginPath();
      ctx.arc(bx, by, BALL_RADIUS + 2, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(200,224,255,0.25)';
      ctx.fill();
      const bg = ctx.createRadialGradient(bx-3, by-3, 0, bx, by, BALL_RADIUS);
      bg.addColorStop(0, '#ffffff');
      bg.addColorStop(0.4, '#d8e8f8');
      bg.addColorStop(1, '#5070a0');
      ctx.beginPath();
      ctx.arc(bx, by, BALL_RADIUS, 0, Math.PI*2);
      ctx.fillStyle = bg;
      ctx.fill();
    }
  }

  function step(){
    if (state.phase !== 'falling' || !state.ball) {
      state.rafId = null;
      return;
    }

    state.frameCount++;
    const b = state.ball;
    b.vy += GRAVITY;
    b.vx *= FRICTION;
    b.x += b.vx;
    b.y += b.vy;

    if (b.x < BALL_RADIUS) { b.x = BALL_RADIUS; b.vx = -b.vx * BOUNCE; }
    if (b.x > W - BALL_RADIUS) { b.x = W - BALL_RADIUS; b.vx = -b.vx * BOUNCE; }

    pegs.forEach(p => {
      const dx = b.x - p.x;
      const dy = b.y - p.y;
      const dist = Math.hypot(dx, dy);
      const minDist = BALL_RADIUS + PEG_RADIUS;
      if (dist < minDist && dist > 0) {
        const nx = dx / dist;
        const ny = dy / dist;
        const overlap = minDist - dist;
        b.x += nx * overlap;
        b.y += ny * overlap;
        const dot = b.vx * nx + b.vy * ny;
        b.vx = (b.vx - 2 * dot * nx) * BOUNCE;
        b.vy = (b.vy - 2 * dot * ny) * BOUNCE;
        b.vx += (Math.random() - 0.5) * HORIZ_KICK;
      }
    });

    if (b.y > slotTopY - BALL_RADIUS) {
      dividers.forEach(d => {
        if (b.y + BALL_RADIUS > d.top) {
          const dx = b.x - d.x;
          if (Math.abs(dx) < BALL_RADIUS) {
            b.x = d.x + Math.sign(dx || 1) * BALL_RADIUS;
            b.vx = -b.vx * BOUNCE;
          }
        }
      });
    }

    // Landing condition: bottom OR safety frame limit
    if (b.y > H - BALL_RADIUS || state.frameCount > MAX_FRAMES) {
      b.y = Math.min(b.y, H - BALL_RADIUS);
      const slotIdx = Math.max(0, Math.min(SLOT_COUNT - 1, Math.floor(b.x / slotWidth)));
      finishDrop(slotIdx);
      return;
    }

    drawBoard();
    state.rafId = requestAnimationFrame(step);
  }

  function finishDrop(slotIdx){
    // Cancel animation cleanly
    if (state.rafId) {
      cancelAnimationFrame(state.rafId);
      state.rafId = null;
    }

    const value = SLOT_VALUES[slotIdx];
    state.total += value;
    state.history.push(value);
    state.highlightSlot = slotIdx;
    state.phase = 'celebrating';

    drawBoard();
    renderSlots();
    renderHistory();
    updateHUD();
    setStatus('+' + value.toLocaleString('pt-BR') + ' PREVCOINS!', '#87ceeb');
    refreshButton(); // still disabled during celebration

    // Clear any previous timer just in case
    if (state.resetTimerId) clearTimeout(state.resetTimerId);
    state.resetTimerId = setTimeout(() => {
      state.resetTimerId = null;
      state.ball = null;
      state.highlightSlot = -1;
      renderSlots();
      drawBoard();

      if (state.chances <= 0) {
        state.phase = 'gameover';
        setStatus('FIM! Total: ' + state.total.toLocaleString('pt-BR'), '#ffd700');
      } else {
        state.phase = 'idle';
        setStatus('COMEÇAR!', '#fff');
      }
      refreshButton();
    }, 1600);
  }

  function dropBall(){
    // Guard: only drop when idle with chances available
    if (state.phase !== 'idle' || state.chances <= 0) return;

    state.phase = 'falling';
    state.chances--;
    state.frameCount = 0;
    state.ball = {
      x: W/2 + (Math.random() - 0.5) * 8,
      y: 24,
      vx: (Math.random() - 0.5) * 1.5,
      vy: 0
    };

    updateHUD();
    setStatus('CAINDO...', '#c8e0ff');
    refreshButton();

    // Cancel any stray frame before starting fresh
    if (state.rafId) cancelAnimationFrame(state.rafId);
    state.rafId = requestAnimationFrame(step);
  }

  function reset(){
    if (state.rafId) { cancelAnimationFrame(state.rafId); state.rafId = null; }
    if (state.resetTimerId) { clearTimeout(state.resetTimerId); state.resetTimerId = null; }
    state.chances = 4;
    state.total = 0;
    state.history = [];
    state.ball = null;
    state.highlightSlot = -1;
    state.phase = 'idle';
    state.frameCount = 0;
    updateHUD();
    renderSlots();
    renderHistory();
    setStatus('COMEÇAR!', '#fff');
    refreshButton();
    drawBoard();
  }

  dropBtn.addEventListener('click', dropBall);
  resetBtn.addEventListener('click', reset);

  renderSlots();
  updateHUD();
  refreshButton();
  drawBoard();
})();
</script>
